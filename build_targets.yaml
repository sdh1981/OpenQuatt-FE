# OpenQuatt build-target matrix.
# `enabled` targets are built and released; `planned` targets are tracked but skipped.
# OpenQuatt FE: only the FE target is built here; the upstream Q targets stay
# listed as `planned` so they can be re-enabled for a baseline comparison.
targets:
  - id: heatpump_controller_q_single
    status: planned
    hardware: heatpump_controller_q
    hardware_label: Electropaultje Heatpump Controller Q-edition
    topology: single
    connection: auto
    config: configs/heatpump_controller_q/single.yaml
    build_path: .esphome/build/heatpump_controller_q_single
    artifact_name: openquatt-heatpump-controller-q-single
    artifact_aliases: openquatt-heatpump-controller-q-single-wifi,openquatt-heatpump-controller-q-single-eth
    manifest_name: openquatt-heatpump-controller-q-single-ota.manifest.json
    display_name: OpenQuatt Heatpump Controller Q Single
    chip_family: ESP32-S3
  - id: heatpump_controller_q_duo
    status: enabled
    hardware: heatpump_controller_q
    hardware_label: Electropaultje Heatpump Controller Q-edition
    topology: duo
    connection: auto
    config: configs/heatpump_controller_q/duo.yaml
    build_path: .esphome/build/heatpump_controller_q_duo
    artifact_name: openquatt-heatpump-controller-q-duo
    artifact_aliases: openquatt-heatpump-controller-q-duo-wifi,openquatt-heatpump-controller-q-duo-eth
    manifest_name: openquatt-heatpump-controller-q-duo-ota.manifest.json
    display_name: OpenQuatt Heatpump Controller Q Duo
    chip_family: ESP32-S3
  - id: heatpump_controller_q_duo_fe
    status: enabled
    hardware: heatpump_controller_q
    hardware_label: Electropaultje Heatpump Controller Q-edition
    topology: duo
    connection: auto
    config: configs/heatpump_controller_q/duo_fe.yaml
    build_path: .esphome/build/heatpump_controller_q_duo_fe
    artifact_name: openquatt-fe-heatpump-controller-q-duo
    manifest_name: openquatt-fe-heatpump-controller-q-duo-ota.manifest.json
    display_name: OpenQuatt FE Heatpump Controller Q Duo
    chip_family: ESP32-S3
