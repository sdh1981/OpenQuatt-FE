<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Hydraulisch schema – doorstroomelement vóór de 3-wegklep</title>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="700" fill="#111">Variant Doorstroom: element in de aanvoer, vóór de 3-wegklep</text>

  <!-- Buitenunits -->
  <rect x="30" y="160" width="150" height="110" rx="8" fill="#eef2f7" stroke="#455a64" stroke-width="1.5"/>
  <text x="105" y="200" text-anchor="middle" font-weight="700">Buitenunits</text>
  <text x="105" y="220" text-anchor="middle">HP1 / HP2</text>
  <text x="105" y="240" text-anchor="middle" fill="#555">(pompen in de ODU)</text>

  <!-- Aanvoer naar element -->
  <line x1="180" y1="185" x2="215" y2="185" stroke="#c62828" stroke-width="4"/>

  <!-- Doorstroomelement -->
  <rect x="215" y="160" width="120" height="50" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="275" y="182" text-anchor="middle" font-weight="700" fill="#ef6c00">3 kW element</text>
  <text x="275" y="199" text-anchor="middle" font-size="11" fill="#ef6c00">(doorstroom)</text>
  <text x="275" y="232" text-anchor="middle" font-size="11">STB 90 °C</text>
  <text x="275" y="246" text-anchor="middle" font-size="11">+ flowschakelaar</text>
  <text x="275" y="150" text-anchor="middle" font-size="11" fill="#555">ontluchter boven</text>

  <!-- na element: PT1000 -->
  <line x1="335" y1="185" x2="405" y2="185" stroke="#c62828" stroke-width="4"/>
  <circle cx="368" cy="185" r="9" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="368" y="215" text-anchor="middle" font-size="12">PT1000</text>
  <text x="368" y="229" text-anchor="middle" font-size="12" font-weight="700">ná het element</text>

  <!-- 3-wegklep -->
  <polygon points="410,170 440,185 410,200" fill="#fff" stroke="#111" stroke-width="2"/>
  <polygon points="470,170 440,185 470,200" fill="#fff" stroke="#111" stroke-width="2"/>
  <polygon points="425,215 440,185 455,215" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="430" y="262" text-anchor="end" font-weight="700">3-wegklep</text>
  <text x="430" y="277" text-anchor="end" font-size="12" fill="#555">veerretour + hulpcontact</text>
  <text x="402" y="180" text-anchor="end" font-size="11">AB</text>
  <text x="478" y="180" font-size="11">A</text>
  <text x="458" y="228" font-size="11">B</text>

  <polyline points="470,185 540,185 540,110 610,110" fill="none" stroke="#c62828" stroke-width="4"/>
  <text x="470" y="98" font-size="12" fill="#c62828">A: bekrachtigd → Boiler</text>
  <polyline points="440,215 440,360 610,360" fill="none" stroke="#c62828" stroke-width="4"/>
  <text x="450" y="350" font-size="12" fill="#c62828">B: rust → CV</text>

  <!-- Boilertank zonder element -->
  <rect x="610" y="50" width="190" height="250" rx="40" fill="#fffaf0" stroke="#5d4037" stroke-width="2"/>
  <text x="705" y="44" text-anchor="middle" font-weight="700">Boilertank</text>
  <polyline points="615,110 690,110 700,125 680,140 700,155 680,170 700,185 680,200 700,215 690,230 795,230" fill="none" stroke="#c62828" stroke-width="3"/>
  <text x="712" y="175" font-size="12">spiraal</text>
  <circle cx="790" cy="80" r="8" fill="#2e7d32"/>
  <text x="808" y="84" font-size="12" fill="#2e7d32">tank top</text>
  <text x="808" y="99" font-size="11" fill="#555">(DS18B20 in huls)</text>
  <circle cx="790" cy="205" r="8" fill="#2e7d32"/>
  <text x="808" y="209" font-size="12" fill="#2e7d32">tank bottom</text>
  

  <rect x="610" y="330" width="190" height="60" rx="8" fill="#eef2f7" stroke="#455a64" stroke-width="1.5"/>
  <text x="705" y="365" text-anchor="middle" font-weight="700">CV / vloerverwarming</text>

  <polyline points="795,230 900,230 900,420 105,420 105,270" fill="none" stroke="#1565c0" stroke-width="4"/>
  <polyline points="800,375 900,375" fill="none" stroke="#1565c0" stroke-width="4"/>
  <text x="500" y="440" text-anchor="middle" fill="#1565c0">retour (spiraal en CV samen terug naar de buitenunits)</text>

  <text x="24" y="462" font-size="11" fill="#555">Het element stookt alleen met flow: tijdens het stoken staat de klep op Boiler en draaien de pompen (CM10, compressor uit). Poortnamen verschillen per merk.</text>
  <!-- pijlpunten -->
  <polygon points="413,185 401,178 401,192" fill="#c62828"/>
  <polygon points="610,110 598,103 598,117" fill="#c62828"/>
  <polygon points="610,360 598,353 598,367" fill="#c62828"/>
  <polygon points="105,272 98,284 112,284" fill="#1565c0"/>
</svg>
