<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Overzicht doorstroomvariant – leidingwerk en bedrading</title>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="700" fill="#111">Overzicht variant Doorstroom: leidingwerk en bedrading</text>
  <text x="24" y="50" font-size="12" fill="#555">De doorstroomverwarmer zit in de aanvoer, vóór de 3-wegklep. Dikke lijnen = water, dunne gestippelde lijnen = bedrading.</text>
  <text x="24" y="66" font-size="12" fill="#555">FS = flowschakelaar, STB = maximaalthermostaat 90 °C met handreset: beide hardwired in serie met de spoel van K1.</text>

  <!-- ========== WATER ========== -->
  <!-- Buitenunits -->
  <rect x="30" y="245" width="140" height="100" rx="8" fill="#eef2f7" stroke="#455a64" stroke-width="1.5"/>
  <text x="100" y="283" text-anchor="middle" font-weight="700">Buitenunits</text>
  <text x="100" y="302" text-anchor="middle">HP1 / HP2</text>
  <text x="100" y="321" text-anchor="middle" font-size="11" fill="#555">(pompen in de ODU)</text>

  <!-- aanvoer: ODU -> flowschakelaar -> verwarmer -->
  <line x1="170" y1="280" x2="220" y2="280" stroke="#c62828" stroke-width="5"/>
  <circle cx="195" cy="280" r="7" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
  <text x="195" y="266" text-anchor="middle" font-size="10" fill="#ef6c00">FS</text>

  <!-- Doorstroomverwarmer -->
  <rect x="220" y="255" width="120" height="50" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="280" y="276" text-anchor="middle" font-weight="700" fill="#e65100">3 kW</text>
  <text x="280" y="293" text-anchor="middle" font-size="11" fill="#e65100">doorstroomverwarmer</text>
  <rect x="262" y="236" width="36" height="16" rx="3" fill="#fff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#e65100">STB</text>
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#555">ontluchter boven</text>

  <!-- verwarmer -> PT1000 -> klep -->
  <line x1="340" y1="280" x2="438" y2="280" stroke="#c62828" stroke-width="5"/>
  <circle cx="380" cy="280" r="8" fill="#fff" stroke="#b71c1c" stroke-width="2"/>
  <text x="380" y="268" text-anchor="middle" font-size="10" fill="#b71c1c">PT1000</text>
  <polygon points="446,280 434,273 434,287" fill="#c62828"/>

  <!-- 3-wegklep -->
  <polygon points="446,266 470,280 446,294" fill="#fff" stroke="#111" stroke-width="2"/>
  <polygon points="494,266 470,280 494,294" fill="#fff" stroke="#111" stroke-width="2"/>
  <polygon points="458,306 470,280 482,306" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="452" y="214" width="36" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="470" y="232" text-anchor="middle" font-size="12" font-weight="700">M</text>
  <line x1="470" y1="240" x2="470" y2="266" stroke="#111" stroke-width="1.5"/>
  <text x="470" y="204" text-anchor="middle" font-size="11" font-weight="700">3-wegklep (veerretour)</text>
  <text x="440" y="276" text-anchor="end" font-size="10">AB</text>
  <text x="498" y="274" font-size="10">A</text>
  <text x="476" y="318" font-size="10">B</text>
  <rect x="500" y="296" width="78" height="22" rx="3" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="539" y="311" text-anchor="middle" font-size="10" fill="#6a1b9a">hulpcontact</text>

  <!-- A -> boiler -->
  <polyline points="494,280 600,280 600,130 692,130" fill="none" stroke="#c62828" stroke-width="5"/>
  <polygon points="700,130 688,123 688,137" fill="#c62828"/>
  <text x="592" y="152" text-anchor="end" font-size="11" fill="#c62828">A: bekrachtigd</text>
  <text x="592" y="166" text-anchor="end" font-size="11" fill="#c62828">→ Boiler</text>
  <!-- B -> CV -->
  <polyline points="470,306 470,455 692,455" fill="none" stroke="#c62828" stroke-width="5"/>
  <polygon points="700,455 688,448 688,462" fill="#c62828"/>
  <text x="608" y="447" font-size="11" fill="#c62828">B: rust → CV</text>

  <!-- Boilertank -->
  <rect x="700" y="80" width="180" height="270" rx="40" fill="#fffaf0" stroke="#5d4037" stroke-width="2"/>
  <text x="790" y="72" text-anchor="middle" font-weight="700">Boilertank</text>
  <polyline points="700,130 780,130 792,146 770,162 792,178 770,194 792,210 770,226 792,242 780,258 880,258" fill="none" stroke="#c62828" stroke-width="3"/>
  <text x="800" y="200" font-size="11">spiraal</text>
  <circle cx="868" cy="105" r="7" fill="#2e7d32"/>
  <text x="856" y="109" text-anchor="end" font-size="11" fill="#2e7d32">top</text>
  <circle cx="868" cy="300" r="7" fill="#2e7d32"/>
  <text x="856" y="304" text-anchor="end" font-size="11" fill="#2e7d32">bottom</text>

  <!-- CV -->
  <rect x="700" y="430" width="180" height="50" rx="8" fill="#eef2f7" stroke="#455a64" stroke-width="1.5"/>
  <text x="790" y="460" text-anchor="middle" font-weight="700">CV / vloerverwarming</text>

  <!-- Retour -->
  <polyline points="880,258 940,258 940,625 14,625 14,320 20,320" fill="none" stroke="#1565c0" stroke-width="5"/>
  <polygon points="30,320 18,313 18,327" fill="#1565c0"/>
  <line x1="880" y1="455" x2="940" y2="455" stroke="#1565c0" stroke-width="5"/>
  <text x="520" y="645" text-anchor="middle" font-size="11" fill="#1565c0">retour (spiraal en CV samen terug naar de buitenunits)</text>

  <!-- ========== ELEKTRISCH ========== -->
  <!-- Q -->
  <rect x="230" y="395" width="200" height="200" rx="10" fill="#eef2f7" stroke="#263238" stroke-width="2"/>
  <text x="330" y="418" text-anchor="middle" font-weight="700">Heatpump Controller Q</text>
  <text x="420" y="447" text-anchor="end" font-size="11">R1 NO</text>
  <text x="250" y="447" font-size="11">R2 NO</text>
  <text x="420" y="497" text-anchor="end" font-size="11">T (1-Wire)</text>
  <text x="380" y="447" text-anchor="middle" font-size="11" visibility="hidden">.</text>
  <text x="420" y="567" text-anchor="end" font-size="11">GPIO44 + GND</text>
  <text x="380" y="470" text-anchor="middle" font-size="11">Q-stekker</text>

  <!-- Q-stekker -> PT1000 -->
  <polyline points="380,458 380,288" fill="none" stroke="#b71c1c" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- R1 -> klepmotor -->
  <polyline points="430,443 520,443 520,227 488,227" fill="none" stroke="#5d4037" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="526" y="236" font-size="10" fill="#5d4037">R1 → klepmotor</text>

  <!-- hulpcontact -> GPIO44 -->
  <polyline points="430,563 556,563 556,318" fill="none" stroke="#6a1b9a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="562" y="540" font-size="10" fill="#6a1b9a">hulpcontact → GPIO44</text>

  <!-- T -> tanksensoren -->
  <polyline points="430,493 968,493 968,105 875,105" fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polyline points="968,300 875,300" fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="962" y="200" font-size="10" fill="#2e7d32" text-anchor="end">T → DS18B20</text>

  <!-- R2 -> STB -> FS -> K1-spoel -->
  <rect x="235" y="330" width="90" height="36" rx="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" font-weight="700">K1</text>
  <text x="280" y="360" text-anchor="middle" font-size="10">contactor</text>
  <polyline points="262,395 262,366" fill="none" stroke="#ef6c00" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="225" y="392" font-size="10" fill="#e65100" text-anchor="end">R2 → STB → FS → spoel K1</text>

  <!-- Vermogen: L2 -> K1 -> verwarmer -->
  <line x1="180" y1="352" x2="235" y2="352" stroke="#e65100" stroke-width="3.5"/>
  <text x="176" y="368" font-size="10" fill="#e65100" text-anchor="end">L2 · 16 A</text>
  <text x="176" y="380" font-size="10" fill="#e65100" text-anchor="end">30 mA</text>
  <line x1="305" y1="330" x2="305" y2="305" stroke="#e65100" stroke-width="3.5"/>

  <!-- Legenda -->
  <g font-size="10">
    <line x1="700" y1="530" x2="730" y2="530" stroke="#c62828" stroke-width="5"/><text x="736" y="534">aanvoer</text>
    <line x1="800" y1="530" x2="830" y2="530" stroke="#1565c0" stroke-width="5"/><text x="836" y="534">retour</text>
    <line x1="700" y1="550" x2="730" y2="550" stroke="#e65100" stroke-width="3.5"/><text x="736" y="554">230 V element (L2)</text>
    <line x1="700" y1="570" x2="730" y2="570" stroke="#5d4037" stroke-width="1.8" stroke-dasharray="5 4"/><text x="736" y="574">stuurdraad 230 V</text>
    <line x1="700" y1="590" x2="730" y2="590" stroke="#6a1b9a" stroke-width="1.8" stroke-dasharray="5 4"/><text x="736" y="594">laagspanning (signaal)</text>
  </g>
</svg>
