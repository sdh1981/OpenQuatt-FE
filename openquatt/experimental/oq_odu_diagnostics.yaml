# Opt-in local diagnostic build. Never combine with oq_odu_firmware.yaml.
# Locks the existing heat-pump bus from boot; no ordinary reads/writes or
# automatic firmware recovery. This package is absent from release targets.
external_components:
  - source:
      type: local
      path: ${external_components_path}
    components: [openquatt_odu_diagnostics]

openquatt_odu_diagnostics:
  id: oq_odu_diagnostic_reader
  hub: mod_bus
  web_auth: oq_web_auth_store
  duo: ${flow_secondary_enabled}
  hold_control: !lambda |-
    if (id(oq_enabled).state) id(oq_enabled).turn_off();
    if (id(oq_openquatt_resume_at).year >= 2024) {
      auto call = id(oq_openquatt_resume_at).make_call();
      call.set_datetime(2000, 1, 1, 0, 0, 0);
      call.perform();
    }
