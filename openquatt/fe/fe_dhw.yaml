# ==============================================================================
# OpenQuatt FE - DHW-regeling (fase 4a)
# ==============================================================================
#
# Tikt oq_fe_dhw_runtime: de DHW-toestandsmachine, de compressorniveaus en de
# naad naar het regelhart (CM10). Namen en standaardwaarden komen uit de
# LilyGO-build, zodat de entity-id's in Home Assistant gelijk blijven.
#
# Afwijkingen van de LilyGO-build:
#   - "DHW coil-in level mapping" staat standaard aan en leest de uitlaat van
#     de laatste warmtepomp; de coil-in-sensor bestaat op de Q niet.
#   - Tarief, PV, adaptief leren, tapdetectie en element-only (CM11) volgen in 4c.
# ==============================================================================

globals:
  - id: oq_dhw_legionella_last_done_epoch_s
    type: int64_t
    restore_value: true
    initial_value: '0'

