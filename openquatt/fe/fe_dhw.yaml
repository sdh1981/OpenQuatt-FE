switch:
  - platform: template
    id: oq_dhw_lockout
    name: "DHW lockout"
    icon: mdi:lock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: oq_dhw_boost_after_hp
    name: "DHW boost after HP"
    icon: mdi:heating-coil
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: oq_dhw_boost_hp_assist_enable
    name: "DHW boost HP assist"
    icon: mdi:heat-pump
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: oq_dhw_window_enable
    name: "DHW window enable"
    icon: mdi:clock-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: oq_dhw_legionella_coil_circulation_enable
    name: "DHW legionella coil circulation"
    icon: mdi:sync
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: oq_dhw_coil_map_enable
    name: "DHW coil-in level mapping"
    icon: mdi:stairs
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: oq_dhw_single_hp_mode
    name: "DHW single HP mode"
    icon: mdi:numeric-1-box
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: oq_dhw_assist_enable
    name: "DHW second HP assist"
    icon: mdi:numeric-2-box
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Bewust niet bewaard over een herstart: een snelboost of een geforceerde
  # legionella-run hoort niet vanzelf terug te komen.
  - platform: template
    id: oq_dhw_boost_now
    name: "DHW boost now"
    icon: mdi:rocket-launch
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: template
    id: oq_dhw_src_legionella_force
    name: "DHW source legionella force"
    icon: mdi:bacteria
    optimistic: true
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    id: oq_dhw_clear_fault
    name: "DHW clear fault"
    icon: mdi:restore-alert
    on_press:
      - lambda: |-
          oq_fe_dhw_runtime::runtime().clear_fault();

binary_sensor:
  - platform: template
    id: oq_dhw_hp_request_active_sensor
    name: "DHW HP request active"
    icon: mdi:heat-pump

  - platform: template
    id: oq_dhw_block_cv_priority_sensor
    name: "DHW block CV priority"
    icon: mdi:radiator-off

text_sensor:
  - platform: template
    id: oq_dhw_state_text
    name: "DHW state"
    icon: mdi:state-machine
    update_interval: never

  - platform: template
    id: oq_dhw_fault_text
    name: "DHW fault"
    icon: mdi:alert-circle-outline
    update_interval: never

  - platform: template
    id: oq_dhw_level_reason
    name: "DHW level reason"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: oq_dhw_legionella_last_run
    name: "DHW legionella laatste run"
    icon: mdi:calendar-check
    update_interval: 60s
    lambda: |-
      const int64_t last = id(oq_dhw_legionella_last_done_epoch_s);
      if (last <= 0) return {"Nooit"};
      return {ESPTime::from_epoch_local((time_t) last).strftime("%Y-%m-%d %H:%M")};

  - platform: template
    id: oq_dhw_legionella_next_run
    name: "DHW legionella volgende run"
    icon: mdi:calendar-clock
    update_interval: 60s
    lambda: |-
      const int64_t last = id(oq_dhw_legionella_last_done_epoch_s);
      if (last <= 0) return {"Na 30 min uptime"};
      const int64_t next = last + oq_fe_dhw_runtime::LEGIONELLA_INTERVAL_S;
      return {ESPTime::from_epoch_local((time_t) next).strftime("%Y-%m-%d %H:%M")};

sensor:
  - platform: template
    id: oq_dhw_target_flow_temp_sensor
    name: "DHW target flow temp"
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return oq_fe_dhw_runtime::runtime().target_flow_c();

  - platform: template
    id: oq_dhw_coil_mapped_level
    name: "DHW coil mapped level"
    icon: mdi:stairs
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return oq_fe_dhw_runtime::runtime().mapped_level();

  - platform: template
    id: oq_dhw_assist_level_sensor
    name: "DHW second HP assist level"
    icon: mdi:numeric-2-box
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return oq_fe_dhw_runtime::runtime().assist_level();

interval:
  - interval: 2s
    startup_delay: 6s
    then:
      - lambda: |-
          oq_fe_dhw_runtime::runtime().tick();
