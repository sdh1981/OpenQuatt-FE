# ==============================================================================
# OpenQuatt FE - Electropaultje Heatpump Controller Q-edition / Duo, Full Electric
# ==============================================================================
# Upstream Q Duo firmware plus the FE layer (DHW boiler control: 3-way valve on
# R2, 3 kW element on R1, tank top/bottom DS18B20 on T). The upstream entrypoint
# is included unchanged; FE-specific ownership lives under openquatt/fe/.
substitutions:
  project_version: "v0.53.0-fe.3"
  # FE firmware must never pull an upstream image over itself: OTA manifests
  # point at this repository, and the single/duo switch is disabled because no
  # FE single target exists.
  alternate_topology: ""
  main_release_manifest_url: "https://github.com/sdh1981/OpenQuatt-FE/releases/latest/download/openquatt-fe-heatpump-controller-q-duo-ota.manifest.json"
  dev_release_manifest_url: "https://github.com/sdh1981/OpenQuatt-FE/releases/download/dev-latest/openquatt-fe-heatpump-controller-q-duo-ota.manifest.json"
  alternate_topology_main_release_manifest_url: ""
  alternate_topology_dev_release_manifest_url: ""

esphome:
  build_path: ../../../.esphome/build/heatpump_controller_q_duo_fe

packages:
  openquatt_q_duo: !include duo.yaml
  openquatt_fe_io: !include ../../openquatt/fe/fe_io.yaml
  openquatt_fe_dhw: !include ../../openquatt/fe/fe_dhw.yaml
  openquatt_fe_dhw_tank: !include ../../openquatt/fe/fe_dhw_tank.yaml
